name: SOC Hunt - Lagos iPhone - Auto Badge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hunt:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
            - uses: actions/checkout@v4
      
            - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
            - name: Run Lab 07 - WMI Hunter
        run: |
          echo "### Lab 07 Output" >> $env:GITHUB_STEP_SUMMARY
          python lab07_wmi_hunter.py | Tee-Object -FilePath lab07_output.txt
          Get-Content lab07_output.txt
        continue-on-error: true
      
            - name: Run Lab 08 - Registry Hunter
        run: |
          echo "### Lab 08 Output" >> $env:GITHUB_STEP_SUMMARY
          python lab08_registry_hunter.py | Tee-Object -FilePath lab08_output.txt
          Get-Content lab08_output.txt
        continue-on-error: true

            - name: Auto Update README Proof
        run: |
          $commit = (git rev-parse --short HEAD)
          $date = Get-Date -Format "MMM dd, h:mm tt"
          $content = Get-Content README.md -Raw
          $content = $content -replace 'COMMIT [A-Z0-9]+', "COMMIT $commit"
          $content = $content -replace 'LAB \d+', "LAB 08"
          $content = $content -replace 'Latest:.*', "Latest: Commit $commit - Lab 08 CLEAN ($date)"
          Set-Content -Path README.md -Value $content
          git config user.name "Roland Benjamin - iPhone Lagos"
          git config user.email "roland@soc-toolkit.lagos"
          git add README.md
          git diff --staged --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "docs: auto-update proof badge to $commit - Lab 08 LIVE [skip ci]"; git push }

            - name: Proof Final
        run: echo "✅ SOC Toolkit LAB 08 LIVE - Built on iPhone Lagos - Commit auto-updated"
